<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vault</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>Password MANAGER</h2>

            <form id="addSecretForm"
                style="margin-bottom: 2rem; border-bottom: 1px solid rgba(148, 163, 184, 0.2); padding-bottom: 2rem;">
                <div class="form-group">
                    <label>Service / Website</label>
                    <input type="text" name="service" placeholder="e.g. Google" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="johndoe@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Save Credential</button>
            </form>

            <div id="secretsList">
                <!-- Secrets will be loaded here -->
            </div>

            <button id="logoutBtn" class="logout-btn">Lock Vault</button>
        </div>
    </div>
    <script src="assets/script.js"></script>
</body>

</html>
